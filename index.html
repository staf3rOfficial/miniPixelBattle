<!DOCTYPE html>
<html>
<head>
    <title>Pixel Battle</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(5, 50px); gap: 2px; margin: 20px auto; }
        .pixel { width: 50px; height: 50px; border: 1px solid #ccc; cursor: pointer; }
        .controls { margin: 10px; }
    </style>
</head>
<body>
    <h1>Pixel Battle</h1>
    <div class="controls">
        <button onclick="saveCanvas()">Сохранить</button>
        <button onclick="loadCanvas()">Загрузить</button>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        const GRID_SIZE = 5;
        const colors = ["red", "green", "blue", "yellow", "black", "white"];
        let canvas = Array(GRID_SIZE * GRID_SIZE).fill("white");

        // Создаём сетку
        function initGrid() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const pixel = document.createElement("div");
                pixel.className = "pixel";
                pixel.style.background = canvas[i];
                pixel.onclick = () => {
                    const color = prompt("Выберите цвет (red, green, blue...):");
                    if (colors.includes(color)) {
                        canvas[i] = color;
                        pixel.style.background = color;
                    }
                };
                grid.appendChild(pixel);
            }
        }

        // Сохраняем в localStorage
        function saveCanvas() {
            localStorage.setItem("pixelCanvas", JSON.stringify(canvas));
            alert("Холст сохранён!");
        }

        // Загружаем из localStorage
        function loadCanvas() {
            const saved = localStorage.getItem("pixelCanvas");
            if (saved) {
                canvas = JSON.parse(saved);
                initGrid();
            }
        }

        initGrid();
    </script>
</body>
</html>
